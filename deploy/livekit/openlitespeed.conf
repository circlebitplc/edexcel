# Paste into the live.kandy.edexcel.college vhost in CyberPanel
# (Websites → live.kandy.edexcel.college → Manage → vHost Conf).
# Do not put this on the main kandy.edexcel.college site.
#
# Required:
# - LiveKit listening on 127.0.0.1:7880 (see docker-compose.cyberpanel.yml)
# - Header Alt-Svc: clear  (LiteSpeed HTTP/3 breaks Chrome WebSockets)
# - WebSocket rewrite to ws://127.0.0.1:7880

extprocessor livekit {
  type                    proxy
  address                 127.0.0.1:7880
  maxConns                200
  pcKeepAliveTimeout      120
  initTimeout             60
  retryTimeout            0
  respBuffer              0
}

context / {
  type                    proxy
  handler                 livekit
  addDefaultCharset       off
  extraHeaders            <<<END_extraHeaders
Alt-Svc: clear
END_extraHeaders
}

rewrite  {
  enable                  1
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteRule /(.*) ws://127.0.0.1:7880/$1 [P,L]
}
