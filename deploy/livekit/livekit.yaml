# Paste the same API key/secret as the college Admin → Live classroom settings.
# webhook.api_key must be the key listed under keys.

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  allow_tcp_fallback: true
  # Docker STUN is often wrong. Pin the VPS public IP so ICE/TCP 7881 works.
  use_external_ip: false
  node_ip: 169.58.123.255

redis:
  address: redis:6379

keys:
  REPLACE_API_KEY: REPLACE_API_SECRET

logging:
  level: info

webhook:
  api_key: REPLACE_API_KEY
  urls:
    - https://edexcel.college/api/livekit/webhook.php

turn:
  enabled: true
  domain: live.kandy.edexcel.college
  udp_port: 3478

room:
  auto_create: true
