name: Deploy Kandy Edexcel

# Run JavaScript-based GitHub Actions on Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.KANDY_DEPLOY_KEY }}

      - name: Configure SSH host verification
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          kandy.edexcel.college ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH/H6e/Q4kIYnn8nc5Mx0gDvg2MbuZe/EEET5jsuGK6H
          KNOWN_HOSTS

          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.KANDY_DEPLOY_HOST }}
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            github-deploy@"$DEPLOY_HOST" \
            'sudo /usr/local/bin/deploy-kandy-edexcel'
