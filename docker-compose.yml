version: '3'
services:
  evolution-api:
    image: atendimentoagil/evolution-api:latest
    container_name: evolution-api
    ports:
      - "3000:3000"
    environment:
      - AUTHENTICATION_API_KEY=your-secret-api-key
      - AUTHENTICATION_TYPE=apiKey
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_CREDENTIALS=true
      - WEBHOOK_GLOBAL_URL=https://edexcel.college/webhook.php
      - WEBHOOK_GLOBAL_ENABLED=false
    restart: unless-stopped
    volumes:
      - evolution-api-data:/app/instances
volumes:
  evolution-api-data: